# asset/menu/permission.yaml
# Role-centric permissions: permissions → role → menus | operations | csps
# - menus: mcmp_menus.id 목록 (역할별 접근 가능 메뉴). 컨테이너(비-action) 메뉴도
#   포함해야 사이드바 트리가 끊기지 않는다.
# - operations: (reserved) framework/API operation 권한 ID — 향후 시드
# - csps: (reserved) CSP 관련 권한/역할 키 — 향후 시드
# Menu ids must exist in mc-web-console conf/webconsole_menu_resources.yaml
# (the canonical catalog); unknown ids are skipped at seed time and reported
# as missingPermissionMenuIDs.
# Aligned to catalog revision: mc-web-console develop 3a015768 (61 menus)
permissions:
  - role: admin
    menus:
      # Settings
      - settings
      - accountnaccess
      - organizations
      - companyinfo
      - users
      - groups
      - approvals
      - accesscontrols
      - menus
      - environment
      - cloudsps
      - cloudoverview
      - credentials
      - connections
      - clouddrivers
      - cspaccounts
      - cloudresources
      - serverspecs
      - serverimages
      - networks
      - securitygroups
      - myimages
      - sshkeys
      - disks
      - nlbs
      - resourcesync
      # Operations > Manage
      - operations
      - manage
      - workspaces
      - projects
      - roles
      - csproles
      - workloads
      - infraworkloads
      - k8sworkloads
      - workflows
      - mcworkflows
      - mceventlistener
      - applications
      - swcatalogs
      - appstatus
      - apprepository
      - mcdatamanager
      - mcdatagenerate
      - mcdatamigration
      - mcdatabackup
      - mcdatarestore
      - mcdatalogmanager
      # Operations > Analytics
      - analytics
      - costanalysis
      - costdashboard
      - billingreport
      - costalarm
      - budget
      - mcobservability
      - mco11ymonitorings
      - mc011ylogs
      - mc011yconfig
      - mc011yinsight
      - mc011yalerts
      - mc011ytracing
    operations: []
    csps: []

  - role: billadmin
    menus:
      - operations
      - manage
      - workloads
      - infraworkloads
      - analytics
      - costanalysis
      - costdashboard
      - billingreport
      - costalarm
      - budget
    operations: []
    csps: []

  - role: billviewer
    menus:
      - operations
      - analytics
      - costanalysis
      - costdashboard
      - billingreport
    operations: []
    csps: []

  - role: operator
    menus:
      - operations
      - manage
      - workloads
      - infraworkloads
      - k8sworkloads
      - workflows
      - mcworkflows
      - mceventlistener
      - applications
      - swcatalogs
      - appstatus
      - apprepository
      - mcdatamanager
      - mcdatagenerate
      - mcdatamigration
      - mcdatabackup
      - mcdatarestore
      - mcdatalogmanager
      - analytics
      - mcobservability
      - mco11ymonitorings
      - mc011ylogs
      - mc011yconfig
      - mc011yinsight
      - mc011yalerts
      - mc011ytracing
      - settings
      - environment
      - cloudsps
      - cloudoverview
      - cloudresources
      - networks
      - myimages
      - sshkeys
      - disks
    operations: []
    csps: []

  - role: viewer
    menus:
      - operations
      - analytics
      - mcobservability
      - mco11ymonitorings
      - mc011ylogs
      - mc011yinsight
      - mc011ytracing
    operations: []
    csps: []
