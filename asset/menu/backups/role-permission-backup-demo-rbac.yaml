# scripts/demo/setup-demo-rbac.sh 전용 입력 파일.
# permission.yaml(온보딩 기본 5역할: admin/operator/viewer/billadmin/billviewer)은 건드리지 않고,
# 5모듈(Workflow/Application/Data/Cost/Observability) x 3단계(viewer/operator/admin) 데모용
# 13개 역할의 메뉴 매핑만 이 파일에 선언한다. billviewer/billadmin은 이미 매핑돼 있어 포함하지 않는다.
#
# 반영: POST /api/setup/restore-role-permissions?mode=additive (이 파일을 요청 바디로 그대로 전달)
# — 역할이 이미 존재해야 하며(scripts/demo/setup-demo-rbac.sh가 먼저 POST /api/roles로 생성),
# additive라 재실행해도 안전(이미 매핑된 항목은 건너뜀).
#
# 설계 근거: mcmp-qa/registry/iam-assets/ROLE-TEAM-USER-DEMO-DESIGN.md "1. 역할" 표.
# 메뉴 id는 mc-web-console conf/webconsole_menu_resources.yaml (develop 3a015768) 기준.
# 모듈 화면은 컨테이너 메뉴 + 하위 항목을 함께 매핑해야 사이드바에 노출된다.
